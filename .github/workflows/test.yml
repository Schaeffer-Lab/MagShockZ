name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # The OSIRIS stack (osiris_utils, osh5io, osh5def) is not pip-installable;
      # tests/conftest.py stubs it when absent.
      - name: Install dependencies
        run: pip install -e . pytest pytest-cov

      - name: Run tests
        run: pytest --cov=magshockz --cov-report=term-missing

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magshockz"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "unyt",
    "astropy",
    "plasmapy",
    "yt",
    "pyyaml",
]

[tool.setuptools.packages.find]
include = ["magshockz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["magshockz"]

[tool.coverage.report]
show_missing = true

# Heater theta scan, SURFACE TARGET -- generated, not hand-edited. Every key matches
# runs/magshockz_2d_heater.warpx.yaml except:
#   operators.heater.theta   pinned, so M_A is NOT matched -- that is the point
#   geometry.run_gyroperiods short, so the domain shrinks along z with it
# The transverse half-width is held at production's 35 d_i so r_target/r_spot is 15.1
# here too: lateral confinement by un-illuminated target is exactly what this scan is
# re-measuring, so it cannot be relaxed to make the points cheaper.
#
# Purpose: the theta -> v_piston map was measured with the target no wider than the spot
# (runs/scan_theta/scan_theta_*.warpx.yaml, r_target/r_spot = 1), where the plume expanded
# freely. These three setpoints REUSE that scan's values, so each point is a controlled
# A/B against a completed patch run and the difference is the confinement alone:
#
#   theta    patch v_piston/c    surface
#   0.035        0.02301            ?
#   0.055        0.02746            ?
#   0.085        0.03233            ?
#
# Once all three land, DROP the Z = 14 patch points from calibration: and refit on these
# -- patch and surface runs do not lie on one curve, for the same reason Z = 1 and Z = 14
# do not, and calibration() groups only by charge_number.
schema: heater_pic_2d
meta:
  run_id: scan_surface_055
  deck: inputs_2d_heater
  description: surface-target theta scan point at heater theta = 0.055 (Z = 14)
flash:
  dataset: /pscratch/sd/d/dschnei/FLASH_MagShockZ3D-corrected
  source: scripts/flash_piston_profile.py over 36 dumps, front fit rms 114 um
  window_ns:
  - 3.001
  - 11.752
  ambient:
    species: Al 6+
    ion_density_per_m3: 8.2851e+23
    magnetic_field_tesla: 7.00013
    electron_temperature_ev: 9.82893
    ion_temperature_ev: 9.82893
  piston:
    species: Si 14+
    ion_density_per_m3: 1.4898e+24
    front_speed_km_s: 768.5
    spot_radius_um: 500.0
    target_halfwidth_um: 8500.0
reference:
  density_per_m3: 1.0e+18
  ambient_mass_per_charge: 50.0
plasma:
  piston:
    initial_temperature_ev: 511.0
geometry:
  slab_halfwidth_di: 2.0
  slab_radius_di: null
  spot_radius_di: null
  transverse_halfwidth_di: 35.0
  domain_halfwidth_di: null
  cell_size_de: 0.12
  run_gyroperiods: 0.06
  boundary: periodic
numerics:
  particle_shape: 3
  cfl: 0.75
  ppc_each_dim:
  - 5
  - 5
  max_grid_size: 256
  blocking_factor: 8
operators:
  drive_stop_gyroperiods: null
  heater:
    intervals: 20
    super_gaussian_order: 2
    theta: 0.055
  injector:
    intervals: 20
    tau_over_wpe_inv: 10.0
    ppc_reference: 100
calibration:
- run_id: magshockz_2d_heater_v1
  heater_theta: 0.04
  piston_mass_per_charge: 100.0
  piston_speed_over_c: 0.0202
  achieved_theta: 0.02859
- run_id: magshockz_2d_heater_v2
  heater_theta: 0.088227
  piston_mass_per_charge: 100.0
  piston_speed_over_c: 0.035284
  achieved_theta: 0.07067
- run_id: magshockz_2d_heater_v3
  heater_theta: 0.017511
  piston_mass_per_charge: 22.301555
  piston_speed_over_c: 0.01652
  achieved_theta: 0.01035
  charge_number: 14
- run_id: scan_theta_035
  heater_theta: 0.035
  piston_mass_per_charge: 22.301555
  piston_speed_over_c: 0.02301
  charge_number: 14
- run_id: scan_theta_055
  heater_theta: 0.055
  piston_mass_per_charge: 22.301555
  piston_speed_over_c: 0.02746
  charge_number: 14
- run_id: scan_theta_085
  heater_theta: 0.085
  piston_mass_per_charge: 22.301555
  piston_speed_over_c: 0.03233
  charge_number: 14
diagnostics:
  plotfile_intervals: 1500
  reduced_intervals: 20
  phase_space_intervals: 1000000
  phase_space_fraction: 0.02
  checkpoint_intervals: 1000000
runtime:
  exe: /pscratch/sd/d/dschnei/warpx/build_pm_gpu_2d/bin/warpx.2d
  nodes: 4
  walltime: 06:00:00
  account: m5032_g
  qos: regular
smoke:

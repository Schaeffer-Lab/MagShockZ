# 2D WarpX heater-driven piston. Single source of truth: only primaries live here.
#
# Everything derived -- B0, v_A, d_e, d_i, T_ci, the betas, the heater setpoint, dt,
# the cell counts -- is computed by src/warpx/units.py. Regenerate with:
#   python scripts/make_warpx_deck.py --config runs/magshockz_2d_heater.warpx.yaml
#
# YAML 1.1: an exponent needs a dot in the mantissa AND a sign, or it loads as a string.

schema: heater_pic_2d

meta:
  run_id: magshockz_2d_heater
  deck: inputs_2d_heater
  description: >
    2D3V full-PIC magnetized piston driven by the ParticleHeater/TargetInjector
    laser-ablation surrogate, matched to FLASH MagShockZ3D-corrected in dimensionless
    terms at a reduced ion mass.

# What the deck is matched to. Measured or read from flash.par -- never tuned.
flash:
  dataset: /pscratch/sd/d/dschnei/FLASH_MagShockZ3D-corrected
  source: scripts/flash_piston_profile.py over 36 dumps, front fit rms 114 um
  window_ns: [3.001, 11.752]

  ambient:                          # unperturbed chamber IC, Al foam
    species: Al 6+                  # the charge state we impose; FLASH's EOS says 3.66,
                                    # so the deck's ambient n_e is 1.64x FLASH's
    ion_density_per_m3: 8.2851e+23
    magnetic_field_tesla: 7.00013
    electron_temperature_ev: 9.82893
    ion_temperature_ev: 9.82893

  piston:                           # measured over the window; there is none at t = 0
    species: Si 14+                 # FLASH's EOS reaches Zbar 13.97 here, so this is free
    ion_density_per_m3: 1.4898e+24  # just behind the front, not the stagnated peak
    front_speed_km_s: 768.5
    spot_radius_um: 500.0           # flash.par laser spot

# The one free physics knob. Sets d_i/d_e = sqrt(m/Ze) and hence the cost, which
# scales as (m/Ze)^2: 25 -> 10 node-hours, 50 -> 40, 100 -> 161.
reference:
  density_per_m3: 1.0e+18           # free; fixes d_e and 1/omega_pe only
  ambient_mass_per_charge: 50.0     # m_i/(Z m_e) in the deck; real Al 6+ is 8196

plasma:
  piston:
    initial_temperature_ev: 511.0   # cold load; the heater does the heating

geometry:
  slab_halfwidth_di: 2.0            # piston reservoir thickness along z
  slab_radius_di: null              # null -> the laser spot radius; a finite patch,
                                    # so the plume can decompress radially as FLASH's does
  transverse_halfwidth_di: 11.3     # matches FLASH's transverse extent
  domain_halfwidth_di: null         # null -> sized from the front travel, both directions
  cell_size_de: 0.12                # set by the Debye criterion; gives lambda_De/dx 0.037
  run_gyroperiods: null             # null -> the FLASH window above
  boundary: periodic                # required for the uniform applied B

numerics:
  particle_shape: 3
  cfl: 0.75
  ppc_each_dim: [5, 5]
  max_grid_size: 256
  blocking_factor: 8

operators:
  drive_stop_gyroperiods: null      # null -> drive the whole run; FLASH's laser does not
  heater:
    intervals: 20
    super_gaussian_order: 2         # exp(-(r^2/rH^2)^(K/2)); 2 = Gaussian
  injector:
    intervals: 20
    tau_over_wpe_inv: 10.0
    ppc_reference: 100

# Completed runs, fitted to predict the heater setpoint for the required piston speed.
# The operator has no setpoint feedback, so this map is measured, not modelled.
# achieved_theta is (2/3)<KE>/(m_e c^2) for the piston electrons at the last EP.txt row.
calibration:
  - run_id: magshockz_2d_heater_v1
    heater_theta: 0.04
    piston_mass_per_charge: 100.0
    piston_speed_over_c: 0.0202
    achieved_theta: 0.02859
  - run_id: magshockz_2d_heater_v2
    heater_theta: 0.088227
    piston_mass_per_charge: 100.0
    piston_speed_over_c: 0.035284
    achieved_theta: 0.07067

diagnostics:
  plotfile_intervals: 1500          # ~70 dumps; rescale whenever max_step moves
  reduced_intervals: 20
  phase_space_intervals: 12000      # ~9 dumps of raw particles, sparsely
  phase_space_fraction: 0.02
  checkpoint_intervals: 15000

runtime:
  exe: /pscratch/sd/d/dschnei/warpx/build_pm_gpu_2d/bin/warpx.2d
  nodes: 16
  walltime: "06:00:00"
  account: m5032_g
  qos: regular

smoke:
  domain_scale: 0.25
  ppc_each_dim: [2, 2]
  max_step: 200
  plotfile_intervals: 50
  reduced_intervals: 10

# FLASH-side analysis config for the FLASH_MagShockZ3D-Trantham_2026-07 run
# (the 2026-07 data, with the corrected magnetic fields).
#
# This run has no OSIRIS deck seeded from it, so the config points DIRECTLY at the
# FLASH output directory and states the line of sight itself (the "direct" mode of
# src/flash_source.py). The alternative — used by flash_3d_noshield.yaml — is to name
# an OSIRIS run with `sim_dir:` and inherit data_path/start_point/end_point from its
# run.yaml. Set one or the other; flash_data_dir wins if both are present.
#
# Used by the FLASH scripts: flash_overview.py, flash_rh_prediction.py,
# tune_flash_shock.py, run_flash_pressure_partition.py, flash_3d_movie.py.
#
# Distances/velocities are PHYSICAL CGS (cm, cm/s) unless noted.

# Directory of MagShockZ_hdf5_plt_cnt_* files. Override with $MAGSHOCKZ_FLASH_DIR.
flash_data_dir: /mnt/cellar/shared/simulations/FLASH_MagShockZ3D-Trantham_2026-07

# Line of sight the 1D line-outs are extracted along [cm], same convention as the
# generator's --start_point/--end_point. This is the canonical radial LOS carried
# over from the perlmutter_1d runs (along +y at x=z=0). The 3D domain here is
# x,z in [-0.85, 0.85] and y in [-0.1, 1.6] cm, so the far end can be pushed out
# past 0.70 if the shock runs off the end of the current window.
line_of_sight:
  start_point: [0, 0.0, 0]
  end_point:   [0.7, 0.70, 0]

# Plot-file index that anchors t=0 for the front trajectory (default 0). In the
# via-run configs this is the dump that seeded the OSIRIS deck; here it is just the
# dump you want times measured from.
ic_index: 0

# Where results go. Without this, every config analysing this FLASH run writes into
# results/FLASH_MagShockZ3D-Trantham_2026-07/ and the on-axis figures get overwritten
# (worse: flash_rh_prediction reads flash_overview_*.npz back out of that directory and
# would pick up the wrong line of sight). This config is a VARIANT of the on-axis one —
# same dataset, different LOS — so it claims its own sub-directory:
#     results/FLASH_MagShockZ3D-Trantham_2026-07/flash_3d_2026-07_offaxis/
# `auto` names it after this file, so renaming the config renames the directory. Use a
# literal name instead if you want something shorter, or `results_dir: <path>` to put
# the output somewhere else entirely. --output-dir beats both.
# The dataset-level movie3d/ grid cache is NOT affected: flash_3d_movie.py keys it on
# the FLASH directory, so the expensive AMR sampling stays shared between variants.
results_subdir: auto

# Experimental streaked shadowgraphy to compare against
# (scripts/flash_experiment_compare.py).  The streak has the same layout as the FLASH
# nₑ streak — time [ns] horizontal, one spatial axis vertical.  THE IMAGE'S OWN AXES ARE
# THE FRAME: it is never stretched or resampled into simulation units.  The simulation
# (only ~15 ns of a ~69 ns record) is TRANSLATED onto those axes, and the image is
# CROPPED to the window being looked at.
#
#   csv        : the RAW streak — a 2048×2048 CSV of camera counts.  Preferred source:
#                the pixel grid IS the measurement, so the axes come from the
#                calibration below and nothing is read off a rendered figure.  Parsed
#                once and cached beside it as .npy.
#   calib      : that data's calibration (px_to_mm, px_to_ns).  Defaults to calib.csv
#                next to the CSV.  2048 × 0.033482716 = 68.573 ns and
#                2048 × 0.005026907 = 10.295 mm — the axes of the whole record.
#   origin     : where mm = 0 sits on the slit — "center" (default, how the streak is
#                normally plotted: ±5.15 mm), "bottom", or a number for the bottom edge.
#   t0_ns      : camera time of the first column (default 0).
#   row0_is_top: true (default) when the file's first row is the largest mm, as the
#                camera writes it; the loader flips it so the array ascends in mm.
#
# Rendered-figure fallback (used only when `csv` is absent): `image` + `crop_px` +
# `axes: {t_ns, x_mm}` scrape a decorated matplotlib PNG, whose plot box is
# auto-detected and whose spans have to be read off the burned-in ticks by hand.
#
# view — the window to plot, in those same ns/mm.  The image is pixel-cropped to it (no
# rescaling); null means "the stretch of the record FLASH covers".  --t-window /
# --x-window override, --full-range shows everything.
#
# registration — where FLASH lands on the image's axes.  The camera trigger and the mm
# zero have no known FLASH counterpart, so this is the only free parameter set: a rigid
# translation plus an optional direction flip.
#   t_exp = t_flash + t_offset_ns          mm = ±(los_µm / 1000) + x_offset_mm
#   t_offset_ns : experiment time [ns] at which FLASH t = 0 occurs.
#   x_offset_mm : experiment position [mm] of LOS distance 0 (the LOS start point).
#   flip_space  : true when the experiment's +mm runs opposite to the line of sight.
# Set it by hand (--t-offset-ns / --x-offset-mm / --flip-space) or fit it with --fit,
# which slides FLASH over the image and maximises the cross-correlation.
#
# The values below are anchored on physics rather than on --fit: t_offset = the measured
# plasma onset (2.5 ns, where the signal turns on) and x_offset = where the measured
# front is launched (−1.2 mm).  --fit agrees on the space offset but NOT on time: its
# r map (results/<run>/flash_experiment_fit.png) is a broad ridge, flat to ±0.03 in r
# across all 53 ns of trial offsets.  The reason is physical, not a registration
# problem: the FLASH leading edge runs at ≈870 km/s (3.8→7.3 ns, 3.1→6.1 mm) while the
# measured front runs at ≈220 km/s, so no translation makes the two coincide.
experiment:
  csv: experiment/shot3/shadowgraphy_streaked/z4290_Laserstreak.csv
  calib: experiment/shot3/shadowgraphy_streaked/calib.csv
  origin: center
  t0_ns: 0.0
  view:
    t_ns: [5.0, 30.0]
    x_mm: [-2.0, 6.0]
  registration:
    # t_offset_ns: 8.0
    t_offset_ns: -4.0
    # x_offset_mm: -1.0
    x_offset_mm: -8.0
    flip_space: false

  # Straight-line features overlaid on every panel: x(t) = x0_mm + v_kms·(t − t0_ns).
  # Hand-fit these against the figures — the units are the ones the axes are in
  # (km/s, mm, ns), so 300 km/s = 0.3 mm/ns is a slope you can read straight off.
  # Anchor (t0_ns, x0_mm) on a point the feature passes through, then open up v_kms
  # until the line lies along it; the script prints where each line starts and ends.
  #   frame: experiment (default) — the image's own mm/ns, for features measured IN THE
  #          DATA. Independent of the registration, so re-registering FLASH slides the
  #          simulation under these lines instead of dragging them along.
  #   frame: flash — LOS mm and FLASH ns, i.e. a simulated feature; translated onto the
  #          image by the registration above. (The FLASH shock front from the `flash:`
  #          block at the bottom of this file is added automatically as one of these.)
  # label/color/style/width are matplotlib's; the legend shows label + speed.
  trajectories:
    # The measured shock front: the sharp ridge crossing the record diagonally.
    - label: measured shock front
      v_kms: 300
      x0_mm: -1.5
      t0_ns: 8.0
      color: "#00e5ff"
      style: "-"
    # The piston plasma — HAND-FIT THIS ONE. Placeholder anchor/slope for now.
    - label: piston plasma
      v_kms: 70.0
      x0_mm: -2.3
      t0_ns: 8.0
      color: "#ffd166"
      style: "--"

# Adiabatic index for the perpendicular-MHD jump (flash_rh_prediction.py).
# gamma=(f+2)/f: 5/3 (3 DOF), 2 (2 DOF), 3 (1 DOF). Default 5/3 if omitted.
# gamma: 1.6667

# FLASH detection seeds / trajectory fit (physical units) — set by
# scripts/tune_flash_shock.py (trajectory mode). Not yet tuned for this run.
#   v_shock_est_cms : shock velocity along the LOS [cm/s]
#   x_shock_0_cm    : shock position along the LOS at the anchor time t_shock_0_s [cm]
#   t_shock_0_s     : anchor [s] — the time the front sat at x_shock_0_cm. Optional;
#                     defaults to the ic_index dump time. The shock here forms partway
#                     through the run, so expect to slide it with 't <ns>'.
# flash:
#   v_shock_est_cms: 0
#   x_shock_0_cm: 0
#   t_shock_0_s: 0

# Per-dump hand-placed front, keyed by plot-file index (set by
# scripts/tune_flash_shock.py --mode regions). These are per-dataset and do NOT
# carry over from flash_3d_noshield.yaml — this run needs its own regions pass.
#   x_shock_cm            : shock-front position along the LOS [cm]
#   x_downstream_start_cm : left edge of the downstream region [cm]
flash_dump_params: {}
flash:
  v_shock_est_cms: 35000000  # set by tune_shock
  x_shock_0_cm: 0.25  # set by tune_shock
  t_shock_0_s: 1.0e-09  # set by tune_shock
